# Translation table: Claude Code plugin content -> Muse skill package.
#
# build.py applies these replacements to the canonical skill sources under
# plugins/lastmilefirst/skills/ when generating adapters/muse/dist/. Patterns
# are applied longest-first so specific phrases win over general ones.
# Replacements apply everywhere, including inside fenced code blocks: a
# `/run-foo` in a fence is mechanism, and leaving it verbatim would hand the
# Muse agent a command that does not exist there.
#
# Rule of thumb for adding entries: translate *mechanism*, keep *judgment*.
# The PARC phases, the review rubrics, the YAGNI/YAGWYDI tension, the Compound
# close — those are platform-agnostic and must survive untouched. Only the
# nouns that name Claude Code machinery get rewritten.

[[replacements]]
pattern = "/run-consult-expert scout"
replacement = "a subagent briefed with the scout-coordinator persona"

[[replacements]]
pattern = "/run-consult-expert "
replacement = "spawning a subagent briefed with the persona "

