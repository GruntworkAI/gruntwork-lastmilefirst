# Common Secret Formats for Gitleaks
# Plugin-shipped rules covering gaps in gitleaks defaults.
# These complement (not replace) gitleaks' built-in rules.
#
# Tier 1: Ships with lastmilefirst plugin.
# Updated via: /run-scan-secrets --update-formats

title = "Common Secret Formats (lastmilefirst)"

# --- AI / LLM Provider Keys ---
#
# gitleaks 8.30.1 defaults cover NONE of these. Verified by behavioural probe
# against synthetic format-valid keys: of the LLM vendors tested, only Google AI
# (`AIza…`) was caught, by the built-in `gcp-api-key` rule — hence no rule for it
# here. Anthropic, OpenAI (legacy, project, and service-account forms),
# HuggingFace, Groq, OpenRouter, and Replicate were all missed.
#
# This was a real, exploited-in-practice gap: a live Anthropic key and a live
# OpenAI key sat in a committed tfstate for ~12 months and were only ever
# surfaced because the *filename* matched `lmf-terraform-state`. In any file
# without a recognised name, the scan reported clean.
#
# All rules below are prefix-anchored. Vendor prefixes are distinctive enough
# that precision costs nothing; a length-only or entropy-only rule would trade
# these findings for noise.

[[rules]]
id = "lmf-anthropic-api-key"
description = "Anthropic API key (console or admin)"
regex = '''sk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_\-]{80,}'''
tags = ["ai", "llm", "anthropic"]
keywords = ["sk-ant-"]

[[rules]]
id = "lmf-openai-project-key"
description = "OpenAI project or service-account API key"
regex = '''sk-(?:proj|svcacct)-[A-Za-z0-9_\-]{40,}'''
tags = ["ai", "llm", "openai"]
keywords = ["sk-proj-", "sk-svcacct-"]

[[rules]]
id = "lmf-openai-legacy-key"
description = "OpenAI legacy API key (48-char form)"
# Trailing \b bounds the match to exactly 48 alphanumerics, so a longer
# alphanumeric run is not reported as a legacy key.
#
# NOTE FOR ANYONE EDITING THIS FILE: gitleaks compiles rules with Go's RE2
# engine, which has NO lookahead or backreferences. A `(?!...)` here does not
# fail gracefully — it panics gitleaks at config-load time, which kills every
# rule in the merged config, not just this one. Test any regex change by
# actually running a scan before shipping it.
regex = '''sk-[A-Za-z0-9]{48}\b'''
tags = ["ai", "llm", "openai"]
keywords = ["sk-"]

[[rules]]
id = "lmf-huggingface-token"
description = "Hugging Face user access token"
regex = '''hf_[A-Za-z0-9]{34,}'''
tags = ["ai", "llm", "huggingface"]
keywords = ["hf_"]

[[rules]]
id = "lmf-groq-api-key"
description = "Groq API key"
regex = '''gsk_[A-Za-z0-9]{40,}'''
tags = ["ai", "llm", "groq"]
keywords = ["gsk_"]

[[rules]]
id = "lmf-openrouter-key"
description = "OpenRouter API key"
regex = '''sk-or-v1-[a-f0-9]{64}'''
tags = ["ai", "llm", "openrouter"]
keywords = ["sk-or-v1-"]

[[rules]]
id = "lmf-replicate-token"
description = "Replicate API token"
regex = '''r8_[A-Za-z0-9]{35,}'''
tags = ["ai", "llm", "replicate"]
keywords = ["r8_"]

# --- Database Connection Strings ---

[[rules]]
id = "lmf-postgres-connection-string"
description = "PostgreSQL connection string with embedded credentials"
regex = '''postgres(?:ql)?://[^:]+:[^@]+@[^/]+'''
tags = ["database", "connection-string"]
keywords = ["postgres"]
[rules.allowlist]
description = "Fixture paths and local/dummy databases — not production credentials"
paths = '''(?:test|spec|mock|fixture|example|sample|demo)'''
regexes = ['''://[^:@/]+:(?:postgres|mysql|mongo|redis|password|passwd|pass|secret|changeme|example|test|dummy|local)@(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|db|database|postgres|mysql|mongo|redis|host\.docker\.internal)''']

[[rules]]
id = "lmf-mysql-connection-string"
description = "MySQL connection string with embedded credentials"
regex = '''mysql://[^:]+:[^@]+@[^/]+'''
tags = ["database", "connection-string"]
keywords = ["mysql"]
[rules.allowlist]
description = "Fixture paths and local/dummy databases — not production credentials"
paths = '''(?:test|spec|mock|fixture|example|sample|demo)'''
regexes = ['''://[^:@/]+:(?:postgres|mysql|mongo|redis|password|passwd|pass|secret|changeme|example|test|dummy|local)@(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|db|database|postgres|mysql|mongo|redis|host\.docker\.internal)''']

[[rules]]
id = "lmf-mongodb-connection-string"
description = "MongoDB connection string with embedded credentials"
regex = '''mongodb(?:\+srv)?://[^:]+:[^@]+@[^/]+'''
tags = ["database", "connection-string"]
keywords = ["mongodb"]
[rules.allowlist]
description = "Fixture paths and local/dummy databases — not production credentials"
paths = '''(?:test|spec|mock|fixture|example|sample|demo)'''
regexes = ['''://[^:@/]+:(?:postgres|mysql|mongo|redis|password|passwd|pass|secret|changeme|example|test|dummy|local)@(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|db|database|postgres|mysql|mongo|redis|host\.docker\.internal)''']

[[rules]]
id = "lmf-redis-connection-string"
description = "Redis connection string with embedded credentials"
regex = '''redis://[^:]*:[^@]+@[^/]+'''
tags = ["database", "connection-string"]
keywords = ["redis"]
[rules.allowlist]
description = "Fixture paths and local/dummy databases — not production credentials"
paths = '''(?:test|spec|mock|fixture|example|sample|demo)'''
regexes = ['''://[^:@/]+:(?:postgres|mysql|mongo|redis|password|passwd|pass|secret|changeme|example|test|dummy|local)@(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|db|database|postgres|mysql|mongo|redis|host\.docker\.internal)''']

# --- Environment Variable Secrets ---

[[rules]]
id = "lmf-env-secret-value"
description = "Environment variable with high-entropy secret value"
regex = '''(?i)(?:SECRET|PASSWORD|TOKEN|API_KEY|APIKEY|ACCESS_KEY|PRIVATE_KEY)\s*=\s*["']?[A-Za-z0-9/+=]{20,}["']?'''
path = '''\.env(?:\.\w+)?$'''
tags = ["env", "secret"]
keywords = ["SECRET", "PASSWORD", "TOKEN", "API_KEY", "ACCESS_KEY"]

[[rules]]
id = "lmf-dotenv-committed"
description = "Committed .env file (should be in .gitignore)"
regex = '''^\w+=.+'''
path = '''(?:^|/)\.env$'''
tags = ["env", "committed-file"]
keywords = ["="]

# --- Terraform Secrets ---

[[rules]]
id = "lmf-terraform-secret-var"
description = "Terraform tfvars file with secret-like values"
regex = '''(?i)(?:password|secret|token|api_key|access_key|private_key)\s*=\s*"[^"]{8,}"'''
path = '''\.tfvars(?:\.\w+)?$'''
tags = ["terraform", "infrastructure"]
keywords = ["password", "secret", "token"]

[[rules]]
id = "lmf-terraform-state"
description = "Committed Terraform state file (contains secrets)"
# Match the state file's unique top-level header key (appears once per file)
# rather than every line (`.+`). This flags the committed tfstate exactly once
# instead of emitting one finding per line, and — critically — it no longer
# masks the actual secrets inside the file: gitleaks dedupes findings per
# location, so a greedy `.+` here would suppress the default rules (aws, api
# keys, etc.) that should catch the real credentials on those lines.
regex = '''"terraform_version"\s*:'''
path = '''(?:^|/)terraform\.tfstate(?:\.backup)?$'''
tags = ["terraform", "state-file"]
keywords = ["terraform_version"]

# --- Hardcoded Credentials ---

[[rules]]
id = "lmf-hardcoded-password"
description = "Hardcoded password assignment in code"
regex = '''(?i)(?:password|passwd|pwd)\s*[:=]\s*["'][^"'\s]{8,}["']'''
tags = ["credential", "hardcoded"]
keywords = ["password", "passwd", "pwd"]
[rules.allowlist]
paths = ['''(?:test|spec|mock|fixture|example|sample|demo)''']

[[rules]]
id = "lmf-bearer-token-hardcoded"
description = "Hardcoded Bearer token in code"
regex = '''(?i)(?:Authorization|Bearer)\s*[:=]\s*["']Bearer\s+[A-Za-z0-9._\-]{20,}["']'''
tags = ["credential", "auth-header"]
keywords = ["Bearer", "Authorization"]
[rules.allowlist]
paths = ['''(?:test|spec|mock|fixture|example|sample|demo)''']

# --- Webhook URLs with Tokens ---

[[rules]]
id = "lmf-slack-webhook"
description = "Slack webhook URL"
regex = '''https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+'''
tags = ["webhook", "slack"]
keywords = ["hooks.slack.com"]

[[rules]]
id = "lmf-discord-webhook"
description = "Discord webhook URL"
regex = '''https://discord(?:app)?\.com/api/webhooks/\d+/[A-Za-z0-9_-]+'''
tags = ["webhook", "discord"]
keywords = ["discord"]

# --- Private Keys ---

[[rules]]
id = "lmf-pem-file-committed"
description = "Committed PEM private key file"
regex = '''-----BEGIN (?:RSA |EC |DSA )?PRIVATE KEY-----'''
tags = ["key", "pem"]
keywords = ["PRIVATE KEY"]

[[rules]]
id = "lmf-pkcs8-key"
description = "PKCS8 encrypted private key"
regex = '''-----BEGIN ENCRYPTED PRIVATE KEY-----'''
tags = ["key", "pkcs8"]
keywords = ["ENCRYPTED PRIVATE KEY"]

# --- JWT Secrets ---

[[rules]]
id = "lmf-jwt-secret"
description = "JWT secret key assignment"
regex = '''(?i)(?:jwt|JWT)[\s_-]*(?:secret|SECRET|key|KEY)\s*[:=]\s*["'][^"']{16,}["']'''
tags = ["jwt", "secret"]
keywords = ["jwt", "JWT"]
[rules.allowlist]
paths = ['''(?:test|spec|mock|fixture|example|sample|demo)''']
